plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.android.autosrt"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.7.6"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        python {
            buildPython "C:\\Program Files\\Python310\\python.exe"
            staticProxy "autosrt"
            pip {
                install "chardet==3.0.4"
                install "idna==2.10"
                install "wave"
                install "requests"
                install "pysrt"
                install "six"
                install "httpx[http2]"
            }
        }
    }

    sourceSets {
        main {
            setRoot "src/main"
            python {
                srcDirs = ["src/main/python"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'androidx.documentfile:documentfile:1.0.1'
    //implementation 'com.arthenica:mobile-ffmpeg-full:4.3.1.LTS'
    //implementation 'com.arthenica:mobile-ffmpeg-full:4.4'
    //implementation(name: 'mobile-ffmpeg-full-4.3.1.LTS', ext: 'aar')
    //implementation files('libs/mobile-ffmpeg-full-4.3.1.LTS.aar')
    //implementation 'org.apache.commons:commons-lang3:3.0'
}
